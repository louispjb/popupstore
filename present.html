<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 고향 팝업스토어 · 결과 발표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#F4F1E8; --panel:#FFFFFF; --panel-2:#F1EBDD;
    --ink:#2A2620; --ink-soft:#7A756C;
    --accent:#E8553A; --accent-ink:#FFFFFF;
    --gold:#B8862E; --teal:#1E8F76; --steel:#8B8577; --line:#E4DFD2;
    --shadow: 0 12px 28px -14px rgba(0,0,0,.18);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
  body{
    font-family:'Noto Sans KR',sans-serif;
    padding-inline:28px; padding-block:26px;
    display:flex; flex-direction:column; gap:20px;
    max-width:1280px; margin-inline:auto; min-height:100dvh;
    position:relative;
  }
  body::before{ content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background: linear-gradient(#D9EAF3 0, #E8F1EF 240px, var(--bg) 520px); }
  body > *{ position:relative; z-index:1; }

  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; }
  .badge{
    display:inline-flex; align-self:flex-start; align-items:center; gap:6px;
    color:#6B7A83; font-size:11.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    padding:4px 0; border-top:1px solid #B9CCD6; border-bottom:1px solid #B9CCD6; margin-bottom:8px;
  }
  h1{ font-family:'Gothic A1',sans-serif; font-weight:900; font-size:clamp(26px,3.8vw,40px); margin:0; letter-spacing:-.01em; }
  h1 .cut{ position:relative; display:inline-block; color:var(--ink); }
  h1 .cut::after{ content:''; position:absolute; left:-4%; right:-4%; bottom:6%; height:34%; background:var(--accent); z-index:-1; transform:skewX(-10deg); opacity:.9; }

  .joinbox{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 18px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow); }
  .joinbox img{ width:84px; height:84px; border-radius:6px; background:#fff; padding:4px; }
  .joinbox .urlrow{ display:flex; gap:8px; align-items:center; }
  .joinbox input{ font-family:monospace; font-size:13px; padding:8px 10px; border-radius:5px; border:1px solid var(--line); background:var(--bg); color:var(--ink); width:220px; }
  .joinbox button{ border:1px solid var(--line); background:var(--panel-2); color:var(--ink); border-radius:5px; padding:8px 12px; font-family:inherit; font-size:13px; cursor:pointer; }
  .joinbox .label{ font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:4px; }

  .galleryhead{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .count{ color:var(--ink); font-family:'Gothic A1',sans-serif; font-weight:900; font-size:16px; }
  .resetbtn{ border:1px solid var(--line); background:var(--panel); color:var(--accent); font-weight:700; border-radius:4px; padding:8px 16px; font-size:13px; cursor:pointer; font-family:inherit; }

  /* ===== 플리마켓 거리: 매대가 쭉 늘어선 한 줄이 한 '거리' ===== */
  .gallery{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); column-gap:0; row-gap:22px; }
  .empty{ grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:16px; border:1px dashed #B9CCD6; border-radius:10px; background:rgba(255,255,255,.6); }
  .card{ cursor:pointer; display:flex; flex-direction:column; animation:pop .3s ease; transition:transform .18s ease; }
  .card:hover{ transform:translateY(-4px); }
  @keyframes pop{ from{opacity:0; transform:scale(.94);} to{opacity:1; transform:scale(1);} }

  /* ---------- 매대 장면 (카드/팝업 공용). 크기는 .dish 너비 기준(cqw) ---------- */
  .dish{
    position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; container-type:inline-size;
    background:linear-gradient(180deg,#D9EAF3 0, #E9F2EE 62%, #E3D8B8 80%);
  }
  .dish .sv{ position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
  .dish .front{ z-index:6; }
  .bulb{ fill:#E8DDBB; transition:fill .3s; }
  .glow{ opacity:0; transition:opacity .4s; }
  .dish.opening .bulb, .dish[data-revealed="true"] .bulb{ fill:#FFE27A; }
  .dish.opening .glow, .dish[data-revealed="true"] .glow{ opacity:.45; }

  .frame{
    position:absolute; left:22%; top:28%; width:56%; aspect-ratio:4/3; z-index:2;
    padding:2.2cqw; background:linear-gradient(135deg,#D6A96A,#C08F52); border-radius:1.4cqw;
    box-shadow:0 1.6cqw 2.4cqw -0.8cqw rgba(60,40,10,.55);
    transform-origin:50% 100%; transform:scale(.55) translateY(10%); opacity:0;
  }
  .frame .mat{ width:100%; height:100%; background:#FFFDF6; border-radius:.6cqw; overflow:hidden; display:flex; }
  .frame .dishimg{ width:100%; height:100%; object-fit:contain; display:block; }
  .dish[data-revealed="true"] .frame{ transform:none; opacity:1; }
  .dish.opening .frame{ animation: framePop .6s cubic-bezier(.32,1.7,.55,1) .42s forwards; }
  @keyframes framePop{
    0%{ transform:scale(.55) translateY(10%); opacity:0; }
    60%{ transform:scale(1.07) translateY(-2%); opacity:1; }
    100%{ transform:none; opacity:1; }
  }

  .banner{
    position:absolute; left:10%; width:80%; top:74%; height:12.5%; z-index:3;
    display:flex; align-items:center; justify-content:center; padding:0 4%;
    font-family:'Gothic A1',sans-serif; font-weight:900; font-size:6.2cqw; color:#16463A; letter-spacing:.01em;
    opacity:0; transition:opacity .3s;
  }
  .banner span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .dish[data-revealed="true"] .banner{ opacity:1; }
  .dish.opening .banner{ animation: fadeIn .35s ease .85s forwards; }
  @keyframes fadeIn{ to{ opacity:1; } }

  /* 이름이 적힌 가림막 */
  .curtain{
    position:absolute; left:13.6%; width:72.8%; top:24.8%; height:45.4%; z-index:4;
    transform-origin:50% 0;
    background:
      linear-gradient(90deg, rgba(0,0,0,.07), transparent 18%, rgba(255,255,255,.4) 33%, transparent 50%, rgba(0,0,0,.06) 66%, transparent 83%, rgba(0,0,0,.09)),
      #F1E6CC;
    border-bottom:1.3cqw solid #D8C79F; border-radius:0 0 1.6cqw 1.6cqw;
    box-shadow:0 1.6cqw 2.4cqw -1cqw rgba(60,40,10,.5);
  }
  .curtain::after{ content:''; position:absolute; inset:9% 6% 8%; border:.35cqw dashed rgba(150,120,70,.45); border-radius:1cqw; }
  .curtain .rod{ position:absolute; left:-1.6%; right:-1.6%; top:-1.3cqw; height:2.6cqw; border-radius:1.3cqw; background:linear-gradient(#E6C58C,#B98E4F); }
  .curtain .cname{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.4cqw; text-align:center; color:#3B2A17; z-index:1; padding:0 9%; }
  .curtain .cname small{ font-size:3cqw; letter-spacing:.22em; color:#9A8A6A; font-weight:700; }
  .curtain .cname b{ font-family:'Gothic A1',sans-serif; font-weight:900; font-size:8.4cqw; line-height:1.18; word-break:keep-all; }
  .dish.opening .curtain{ animation: curtainUp .62s cubic-bezier(.55,0,.3,1) forwards; }
  @keyframes curtainUp{
    0%{ transform:scaleY(1); opacity:1; }
    20%{ transform:scaleY(1.04); }
    90%{ transform:scaleY(.04); opacity:1; }
    100%{ transform:scaleY(.02); opacity:0; }
  }
  .dish[data-revealed="true"] .curtain{ display:none; }

  .stamp{
    position:absolute; top:3.2cqw; right:3.2cqw; z-index:7; width:14cqw; height:14cqw; border-radius:50%;
    background:var(--accent); color:#fff; font-family:'Gothic A1',sans-serif; font-weight:900; font-size:3.7cqw;
    display:flex; align-items:center; justify-content:center; text-align:center;
    border:.5cqw solid rgba(255,255,255,.9); box-shadow:0 1.2cqw 3cqw rgba(0,0,0,.35);
    transform:rotate(-14deg) scale(0);
  }
  .dish[data-revealed="true"] .stamp{ transform:rotate(-14deg) scale(1); }
  .dish.opening .stamp{ animation: stampIn .3s cubic-bezier(.4,1.8,.6,1) .95s forwards; }
  @keyframes stampIn{ to{ transform:rotate(-14deg) scale(1); } }

  .card .cardbody{ padding:8px 12px 2px; display:flex; flex-direction:column; gap:4px; }
  .card .hint{ font-size:15px; color:#7B8A93; font-weight:700; text-align:center; padding:4px 0; }
  .regiontag{ font-size:15px; font-weight:900; color:var(--accent); }
  .card .name{ font-family:'Gothic A1',sans-serif; font-weight:900; font-size:21px; line-height:1.2; color:var(--ink); }
  .card .desc{ font-size:14.5px; font-weight:500; color:#5E594F; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tag{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:3px; background:var(--panel-2); color:var(--ink-soft); }
  .tag.teal{ background:color-mix(in srgb, var(--teal) 22%, var(--panel-2)); color:var(--teal); }
  .tags{ display:flex; gap:5px; flex-wrap:wrap; }

  /* ===== 발표 팝업 (멀리서도 보이게: 크게 + 굵게) ===== */
  #present{ position:fixed; inset:0; background:rgba(20,24,28,.9); display:none; align-items:center; justify-content:center; padding:2vh 0; z-index:50; }
  #present.open{ display:flex; }
  .presentcard{
    background:var(--panel); border-radius:14px; width:min(calc(100vw - 190px), 1800px); height:min(96vh, 1060px);
    overflow:hidden; box-shadow:0 40px 80px -20px rgba(0,0,0,.45); display:flex; flex-direction:row;
    border:1px solid var(--line);
  }
  .presentcard .dish{ flex:none; width:min(96vh, 1060px); }
  .presentcard .dish .frame{ left:14.5%; top:22%; width:71%; padding:1.8cqw; }
  .presentbody{ --fs:1; flex:1; min-width:0; padding:3.4vh 3.2vw; display:flex; flex-direction:column; justify-content:center; justify-content:safe center; gap:2.4vh; overflow:hidden; }
  .regionpill{ align-self:flex-start; background:var(--accent); color:#fff; font-weight:900; font-family:'Gothic A1',sans-serif;
    font-size:calc(clamp(22px, min(2.6vw,4.2vh), 46px) * var(--fs)); padding:.2em .8em; border-radius:99px; line-height:1.25; }
  .presentbody .name{ font-family:'Gothic A1',sans-serif; font-weight:900; color:#16130F; line-height:1.15; word-break:keep-all;
    font-size:calc(clamp(38px, min(4.8vw,8vh), 96px) * var(--fs)); }
  .presentbody .blk .lbl{ font-size:calc(clamp(16px, min(1.5vw,2.5vh), 28px) * var(--fs)); font-weight:900; color:var(--accent); letter-spacing:.04em; margin-bottom:.25em; }
  .presentbody .blk .val, .presentbody .desc{ font-size:calc(clamp(26px, min(2.9vw,4.7vh), 54px) * var(--fs)); font-weight:800; line-height:1.38; color:#1F1B16; word-break:keep-all; }
  .presentbody .blk.foreign{ border-left:.35em solid var(--accent); padding-left:.7em; background:rgba(232,85,58,.07); border-radius:0 10px 10px 0; padding-block:.4em; }
  .presentbody .blk.foreign .val{ font-size:calc(clamp(24px, min(2.6vw,4.2vh), 48px) * var(--fs)); }
  .seller{ font-size:calc(clamp(18px, min(1.7vw,2.8vh), 32px) * var(--fs)); font-weight:900; color:var(--gold); }
  @media (max-aspect-ratio: 1/1){
    .presentcard{ flex-direction:column; height:auto; max-height:96vh; width:94vw; overflow:auto; }
    .presentcard .dish{ width:min(100%, 52vh); align-self:center; }
    .presentbody{ padding:20px 24px; overflow:visible; }
  }
  .presentnav{ position:absolute; top:50%; transform:translateY(-50%); background:var(--panel); border:1px solid var(--line); width:64px; height:64px; border-radius:50%; font-size:28px; cursor:pointer; box-shadow:var(--shadow); color:var(--ink); }
  #prevBtn{ left:20px; } #nextBtn{ right:20px; }
  #closePresent{ position:absolute; top:20px; right:24px; background:var(--panel); border:1px solid var(--line); width:48px; height:48px; border-radius:50%; cursor:pointer; font-size:21px; box-shadow:var(--shadow); color:var(--ink); z-index:2; }
  .presentindex{ font-size:calc(clamp(15px, min(1.3vw,2.2vh), 24px)); color:var(--ink-soft); font-weight:700; }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <div class="badge">Pop-up Market · Result Open</div>
      <h1>우리 고향 <span class="cut">팝업스토어</span></h1>
    </div>
    <div class="joinbox">
      <img id="qrImg" alt="접속 QR코드">
      <div>
        <div class="label">학생 접속 주소 (한 번만 입력하면 저장돼요)</div>
        <div class="urlrow">
          <input type="text" id="siteUrl" placeholder="예: https://내사이트주소.web.app/">
          <button id="saveUrlBtn" type="button">저장</button>
        </div>
      </div>
    </div>
  </div>

  <div class="galleryhead">
    <span class="count" id="countLabel">0개 매대 입점</span>
    <div style="display:flex; gap:8px;">
      <button class="resetbtn" id="soundToggleBtn" type="button">🔊 효과음 켜짐</button>
      <button class="resetbtn" id="resetAllBtn" type="button">전체 삭제</button>
    </div>
  </div>

  <div class="gallery" id="gallery">
    <div class="empty">학생들이 매대를 채우면 여기에 실시간으로 나타나요.</div>
  </div>

  <div id="present">
    <button id="closePresent" type="button" aria-label="닫기">✕</button>
    <button class="presentnav" id="prevBtn" type="button" aria-label="이전">‹</button>
    <div class="presentcard" id="presentCard"></div>
    <button class="presentnav" id="nextBtn" type="button" aria-label="다음">›</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getFirestore, collection, onSnapshot, query, orderBy, deleteDoc, doc, getDocs
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const submissionsRef = collection(db, "submissions");

    const CONFIG_LOOKS_UNSET = !firebaseConfig.apiKey || firebaseConfig.apiKey.includes('YOUR_')
      || !firebaseConfig.projectId || firebaseConfig.projectId.includes('YOUR_');
    if (CONFIG_LOOKS_UNSET){
      document.getElementById('gallery').innerHTML =
        '<div class="empty">firebase-config.js에 아직 실제 값이 없어요. Firebase 콘솔에서 복사한 설정을 넣어주세요.</div>';
    }

    // ---------- QR / join box ----------
    const siteUrlInput = document.getElementById('siteUrl');
    const qrImg = document.getElementById('qrImg');
    const saved = localStorage.getItem('kfusion_site_url') || '';
    if (saved) siteUrlInput.value = saved;
    function updateQr(){
      const url = siteUrlInput.value.trim();
      if (!url){ qrImg.removeAttribute('src'); return; }
      qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(url);
    }
    document.getElementById('saveUrlBtn').addEventListener('click', ()=>{
      localStorage.setItem('kfusion_site_url', siteUrlInput.value.trim());
      updateQr();
    });
    updateQr();

    // ---------- gallery ----------
    const galleryEl = document.getElementById('gallery');
    const countLabel = document.getElementById('countLabel');
    let entries = [];
    const revealedIds = new Set(); // 한 번 연 매대는 이 세션 동안 계속 열려있음

    function escapeHtml(str){
      return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ---------- 리빌 효과음: 파일 없이 브라우저에서 즉석으로 만드는 짧은 챠임(저작권 걱정 없음) ----------
    let soundOn = localStorage.getItem('kfusion_sound_off') !== '1';
    let audioCtx = null;
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    function updateSoundBtn(){
      soundToggleBtn.textContent = soundOn ? '🔊 효과음 켜짐' : '🔇 효과음 꺼짐';
    }
    updateSoundBtn();
    soundToggleBtn.addEventListener('click', () => {
      soundOn = !soundOn;
      localStorage.setItem('kfusion_sound_off', soundOn ? '0' : '1');
      updateSoundBtn();
    });
    function playRevealSound(){
      if (!soundOn) return;
      try{
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        // 살짝 통통 튀는 "짜잔~" 느낌의 4음 코드 (C5-E5-G5-C6)
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          const start = now + i * 0.085;
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.22, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.4);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + 0.45);
        });
      } catch(e){ console.warn('효과음 재생 실패:', e); }
    }

    // ---------- 플리마켓 매대 장면 ----------
    const SV_BACK = "<svg class=\"sv\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n<circle cx=\"8\" cy=\"58\" r=\"12\" fill=\"#A9CBA0\" opacity=\".55\"/><circle cx=\"22\" cy=\"52\" r=\"10\" fill=\"#A9CBA0\" opacity=\".55\"/><circle cx=\"40\" cy=\"60\" r=\"13\" fill=\"#A9CBA0\" opacity=\".55\"/><circle cx=\"60\" cy=\"54\" r=\"11\" fill=\"#A9CBA0\" opacity=\".55\"/><circle cx=\"78\" cy=\"60\" r=\"14\" fill=\"#A9CBA0\" opacity=\".55\"/><circle cx=\"93\" cy=\"52\" r=\"11\" fill=\"#A9CBA0\" opacity=\".55\"/><circle cx=\"50\" cy=\"48\" r=\"9\" fill=\"#A9CBA0\" opacity=\".55\"/>\n<rect y=\"80\" width=\"100\" height=\"6.5\" fill=\"#D9C8A0\"/>\n<rect y=\"86.5\" width=\"100\" height=\"13.5\" fill=\"#79AE78\"/><rect y=\"90\" width=\"100\" height=\"1.4\" fill=\"#8FC08C\"/><rect y=\"95\" width=\"100\" height=\"1.4\" fill=\"#8FC08C\"/>\n<rect x=\"10\" y=\"21\" width=\"3.6\" height=\"63\" fill=\"#E9CF9F\"/><rect x=\"12.4\" y=\"21\" width=\"1.2\" height=\"63\" fill=\"#D4B27A\"/>\n<rect x=\"86.4\" y=\"21\" width=\"3.6\" height=\"63\" fill=\"#E9CF9F\"/><rect x=\"88.8\" y=\"21\" width=\"1.2\" height=\"63\" fill=\"#D4B27A\"/>\n<rect x=\"8.6\" y=\"82\" width=\"6.4\" height=\"2.4\" rx=\".6\" fill=\"#C9A56E\"/><rect x=\"85\" y=\"82\" width=\"6.4\" height=\"2.4\" rx=\".6\" fill=\"#C9A56E\"/>\n</svg>";
    const SV_TABLE = "<svg class=\"sv\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n<rect x=\"7\" y=\"69.6\" width=\"86\" height=\"3.2\" rx=\".7\" fill=\"#F1DDB2\"/><rect x=\"7\" y=\"72\" width=\"86\" height=\".8\" fill=\"#C9A56E\"/>\n<path d=\"M8 72.6 H92 V89 q -3.500 3.2 -7.000 0 q -3.500 3.2 -7.000 0 q -3.500 3.2 -7.000 0 q -3.500 3.2 -7.000 0 q -3.500 3.2 -7.000 0 q -3.500 3.2 -7.000 0 q -3.500 3.2 -7.000 0 q -3.500 3.2 -7.000 0 q -3.500 3.2 -7.000 0 q -3.500 3.2 -7.000 0 q -3.500 3.2 -7.000 0 q -3.500 3.2 -7.000 0 Z\" fill=\"#AEDCC8\"/><rect x=\"8.0\" y=\"72.6\" width=\"3.5\" height=\"16.4\" fill=\"#9FD0BA\" opacity=\".75\"/><rect x=\"15.0\" y=\"72.6\" width=\"3.5\" height=\"16.4\" fill=\"#9FD0BA\" opacity=\".75\"/><rect x=\"22.0\" y=\"72.6\" width=\"3.5\" height=\"16.4\" fill=\"#9FD0BA\" opacity=\".75\"/><rect x=\"29.0\" y=\"72.6\" width=\"3.5\" height=\"16.4\" fill=\"#9FD0BA\" opacity=\".75\"/><rect x=\"36.0\" y=\"72.6\" width=\"3.5\" height=\"16.4\" fill=\"#9FD0BA\" opacity=\".75\"/><rect x=\"43.0\" y=\"72.6\" width=\"3.5\" height=\"16.4\" fill=\"#9FD0BA\" opacity=\".75\"/><rect x=\"50.0\" y=\"72.6\" width=\"3.5\" height=\"16.4\" fill=\"#9FD0BA\" opacity=\".75\"/><rect x=\"57.0\" y=\"72.6\" width=\"3.5\" height=\"16.4\" fill=\"#9FD0BA\" opacity=\".75\"/><rect x=\"64.0\" y=\"72.6\" width=\"3.5\" height=\"16.4\" fill=\"#9FD0BA\" opacity=\".75\"/><rect x=\"71.0\" y=\"72.6\" width=\"3.5\" height=\"16.4\" fill=\"#9FD0BA\" opacity=\".75\"/><rect x=\"78.0\" y=\"72.6\" width=\"3.5\" height=\"16.4\" fill=\"#9FD0BA\" opacity=\".75\"/><rect x=\"85.0\" y=\"72.6\" width=\"3.5\" height=\"16.4\" fill=\"#9FD0BA\" opacity=\".75\"/>\n<rect x=\"16\" y=\"62\" width=\"7.2\" height=\"8\" rx=\"1.2\" fill=\"#fff\" opacity=\".75\" stroke=\"#C8C2B2\" stroke-width=\".3\"/><rect x=\"16.6\" y=\"64.6\" width=\"6\" height=\"5.2\" fill=\"#E0733A\"/><rect x=\"16.2\" y=\"60.6\" width=\"6.8\" height=\"2.2\" rx=\".7\" fill=\"#C9503A\"/>\n<path d=\"M76 70 L77.4 63 H83.2 L84.6 70 Z\" fill=\"#C99A5B\"/><circle cx=\"78.6\" cy=\"62.6\" r=\"1.9\" fill=\"#E8862E\"/><circle cx=\"81.4\" cy=\"62.2\" r=\"1.9\" fill=\"#F0A33A\"/><circle cx=\"80\" cy=\"60.6\" r=\"1.8\" fill=\"#E8862E\"/>\n</svg>";
    const SV_FRONT = "<svg class=\"sv front\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n<rect x=\"8\" y=\"21\" width=\"84\" height=\"3.4\" fill=\"#EBD3A3\"/>\n<path d=\"M2 21 L50 3 L98 21 q -6 3.6 -12 0 q -6 3.6 -12 0 q -6 3.6 -12 0 q -6 3.6 -12 0 q -6 3.6 -12 0 q -6 3.6 -12 0 q -6 3.6 -12 0 q -6 3.6 -12 0 Z\" fill=\"#fff\" stroke=\"#D5D9DE\" stroke-width=\".3\"/><line x1=\"50\" y1=\"3\" x2=\"2\" y2=\"21\" stroke=\"#E3E6EA\" stroke-width=\".3\"/><line x1=\"50\" y1=\"3\" x2=\"14\" y2=\"21\" stroke=\"#E3E6EA\" stroke-width=\".3\"/><line x1=\"50\" y1=\"3\" x2=\"26\" y2=\"21\" stroke=\"#E3E6EA\" stroke-width=\".3\"/><line x1=\"50\" y1=\"3\" x2=\"38\" y2=\"21\" stroke=\"#E3E6EA\" stroke-width=\".3\"/><line x1=\"50\" y1=\"3\" x2=\"50\" y2=\"21\" stroke=\"#E3E6EA\" stroke-width=\".3\"/><line x1=\"50\" y1=\"3\" x2=\"62\" y2=\"21\" stroke=\"#E3E6EA\" stroke-width=\".3\"/><line x1=\"50\" y1=\"3\" x2=\"74\" y2=\"21\" stroke=\"#E3E6EA\" stroke-width=\".3\"/><line x1=\"50\" y1=\"3\" x2=\"86\" y2=\"21\" stroke=\"#E3E6EA\" stroke-width=\".3\"/><line x1=\"50\" y1=\"3\" x2=\"98\" y2=\"21\" stroke=\"#E3E6EA\" stroke-width=\".3\"/>\n<path d=\"M50 3 L98 21 L50 21 Z\" fill=\"#788296\" opacity=\".09\"/>\n<path d=\"M98 21 q -6 3.6 -12 0 q -6 3.6 -12 0 q -6 3.6 -12 0 q -6 3.6 -12 0 q -6 3.6 -12 0 q -6 3.6 -12 0 q -6 3.6 -12 0 q -6 3.6 -12 0\" fill=\"none\" stroke=\"#D9452F\" stroke-width=\"1.1\"/><circle cx=\"50\" cy=\"2.4\" r=\"1.3\" fill=\"#D9452F\"/>\n<path d=\"M10 24.8 Q50 31 90 24.8\" fill=\"none\" stroke=\"#5B4A33\" stroke-width=\".35\"/><circle class=\"glow\" cx=\"16.4\" cy=\"27.3\" r=\"3.8\" fill=\"#FFE27A\"/><circle class=\"bulb\" cx=\"16.4\" cy=\"27.3\" r=\"1.5\"/><circle class=\"glow\" cx=\"27.6\" cy=\"28.5\" r=\"3.8\" fill=\"#FFE27A\"/><circle class=\"bulb\" cx=\"27.6\" cy=\"28.5\" r=\"1.5\"/><circle class=\"glow\" cx=\"38.8\" cy=\"29.3\" r=\"3.8\" fill=\"#FFE27A\"/><circle class=\"bulb\" cx=\"38.8\" cy=\"29.3\" r=\"1.5\"/><circle class=\"glow\" cx=\"50.0\" cy=\"29.6\" r=\"3.8\" fill=\"#FFE27A\"/><circle class=\"bulb\" cx=\"50.0\" cy=\"29.6\" r=\"1.5\"/><circle class=\"glow\" cx=\"61.2\" cy=\"29.3\" r=\"3.8\" fill=\"#FFE27A\"/><circle class=\"bulb\" cx=\"61.2\" cy=\"29.3\" r=\"1.5\"/><circle class=\"glow\" cx=\"72.4\" cy=\"28.5\" r=\"3.8\" fill=\"#FFE27A\"/><circle class=\"bulb\" cx=\"72.4\" cy=\"28.5\" r=\"1.5\"/><circle class=\"glow\" cx=\"83.6\" cy=\"27.3\" r=\"3.8\" fill=\"#FFE27A\"/><circle class=\"bulb\" cx=\"83.6\" cy=\"27.3\" r=\"1.5\"/>\n</svg>";
    function stallHTML(en, revealed){
      return '<div class="dish"' + (revealed ? ' data-revealed="true"' : '') + '>' +
        SV_BACK +
        '<div class="frame"><div class="mat"><img class="dishimg" src="' + en.image + '" alt="' + escapeHtml(en.name) + '"></div></div>' +
        SV_TABLE +
        '<div class="banner"><span>' + escapeHtml(en.korean || '우리 고향') + '</span></div>' +
        (revealed ? '' : '<div class="curtain"><i class="rod"></i><div class="cname"><small>OPEN 대기</small><b>' + escapeHtml(en.author || '셀러') + '</b></div></div>') +
        SV_FRONT +
        '<div class="stamp">OPEN</div>' +
      '</div>';
    }

    function renderGallery(){
      countLabel.textContent = entries.length + '개 매대 입점';
      if (entries.length === 0){
        galleryEl.innerHTML = '<div class="empty">학생들이 매대를 채우면 여기에 실시간으로 나타나요.</div>';
        return;
      }
      galleryEl.innerHTML = '';
      entries.forEach((en, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        const revealed = revealedIds.has(en.id);
        card.innerHTML =
          stallHTML(en, revealed) +
          '<div class="cardbody">' +
            (revealed
              ? '<div class="regiontag">' + escapeHtml(en.korean || '') + '</div>' +
                '<div class="name">' + escapeHtml(en.name || '이름 없는 상품') + '</div>' +
                '<div class="desc">' + escapeHtml(en.desc || '') + '</div>'
              : '<div class="hint">가림막을 열어보세요</div>') +
          '</div>';
        card.addEventListener('click', () => openPresent(idx));
        galleryEl.appendChild(card);
      });
    }

    if (!CONFIG_LOOKS_UNSET){
      const q = query(submissionsRef, orderBy('createdAt', 'asc'));
      onSnapshot(q, (snap) => {
        entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderGallery();
      }, (err) => {
        console.error(err);
        galleryEl.innerHTML = '<div class="empty">연결에 문제가 있어요: ' + err.code + '</div>';
      });
    }

    document.getElementById('resetAllBtn').addEventListener('click', async () => {
      if (!confirm('모든 매대를 비울까요? 되돌릴 수 없어요.')) return;
      const snap = await getDocs(submissionsRef);
      await Promise.all(snap.docs.map(d => deleteDoc(doc(db, 'submissions', d.id))));
    });

    // ---------- present mode ----------
    const present = document.getElementById('present');
    const presentCard = document.getElementById('presentCard');
    let currentPresentIdx = 0;

    function renderPresent(){
      const en = entries[currentPresentIdx];
      if (!en){ closePresent(); return; }
      const revealed = revealedIds.has(en.id);
      presentCard.innerHTML =
        stallHTML(en, revealed) +
        '<div class="presentbody"' + (revealed ? '' : ' style="opacity:0"') + '>' +
          (en.korean ? '<div class="regionpill">' + escapeHtml(en.korean) + '</div>' : '') +
          '<div class="name">' + escapeHtml(en.name || '이름 없는 상품') + '</div>' +
          (en.culture ? '<div class="blk"><div class="lbl">이 지역의 무엇을 담았나요?</div><div class="val">' + escapeHtml(en.culture) + '</div></div>' : '') +
          (en.desc ? '<div class="desc">' + escapeHtml(en.desc) + '</div>' : '') +
          (en.author ? '<div class="seller">셀러 · ' + escapeHtml(en.author) + '</div>' : '') +
          '<div class="presentindex">' + (currentPresentIdx+1) + ' / ' + entries.length + '</div>' +
        '</div>';
      // 글이 길어도 한 화면에 다 들어오도록 글자 크기를 자동으로 줄임
      (function fit(){
        const body = presentCard.querySelector('.presentbody');
        if (!body || window.matchMedia('(max-aspect-ratio: 1/1)').matches) return;
        let f = 1; body.style.setProperty('--fs', f);
        while (body.scrollHeight > body.clientHeight + 1 && f > 0.5){ f -= 0.05; body.style.setProperty('--fs', f.toFixed(2)); }
      })();

      if (!revealed){
        const dishEl = presentCard.querySelector('.dish');
        const bodyEl = presentCard.querySelector('.presentbody');
        playRevealSound();
        // 다음 프레임에 opening을 붙여서 애니메이션이 확실히 재생되게 함
        requestAnimationFrame(() => {
          dishEl.classList.add('opening');
        });
        setTimeout(() => {
          revealedIds.add(en.id);
          // data-revealed="true"가 붙는 순간 CSS에서 가림막을 display:none 처리하므로,
          // 'opening' 클래스는 그대로 둬도(제거해도) 다시 닫히는 문제가 없음
          dishEl.setAttribute('data-revealed', 'true');
          bodyEl.style.transition = 'opacity .35s ease';
          bodyEl.style.opacity = '1';
          renderGallery();
        }, 1250);
      }
    }
    function openPresent(idx){ currentPresentIdx = idx; present.classList.add('open'); renderPresent(); }
    window.addEventListener('resize', () => { if (present.classList.contains('open')) renderPresent(); });
    function closePresent(){ present.classList.remove('open'); }

    document.getElementById('closePresent').addEventListener('click', closePresent);
    document.getElementById('prevBtn').addEventListener('click', () => {
      currentPresentIdx = (currentPresentIdx - 1 + entries.length) % entries.length; renderPresent();
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      currentPresentIdx = (currentPresentIdx + 1) % entries.length; renderPresent();
    });
    present.addEventListener('click', (e) => { if (e.target === present) closePresent(); });
    document.addEventListener('keydown', (e) => {
      if (!present.classList.contains('open')) return;
      if (e.key === 'Escape') closePresent();
      if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
      if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
    });
  </script>
</body>
